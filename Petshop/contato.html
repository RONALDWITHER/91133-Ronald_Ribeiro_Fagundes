<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contato Petshop</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="pet-logo.jpg" alt="logopetshop">
        </div>
        <nav>
            <a class="opcoes" href="paginicial.html">Início</a>
            <a class="opcoes" href="servicos.html">Serviços</a>
            <a class="opcoes" href="sobre.html">Sobre Nós</a>
            <a class="opcoes" href="contato.html">Contato</a>
        </nav>
    </header>
    <section class="linha"></section>

    <section class="contato">
        <h2 class="falecon">Fale Conosco</h2>
        <form>
            <label for="Nome">Nome:</label><br><br>
            <input type="text" id="Nome" name="nome" placeholder="Seu Nome" required><br><br>

            <label for="E-mail">E-mail:</label><br><br>
            <input type="email" id="email" name="email" placeholder="Seu E-mail" required><br><br>

            <label for="mensagem">Mensagem:</label><br><br>
            <textarea id="mensagem" name="mensagem" placeholder="Sua Mensagem"
            style="width: 169px; height: 68px;"></textarea><br><br>

            <button class="botao" type="submit">Enviar</button>

        </form>

        <h3>Ou fale diretamente pelo WhatsApp</h3>
        <a href="https://wa.me/5575940028922" class="botaozap" target="_blank">
            <img class="imgzap" src="whatsapp.png" alt="WhatsApp">
            Enviar mensagem no WhatsApp
          </a>
    </section>
    <section class="linha"></section>
    <footer>
        <p class="Rodape">&copy; 2024 Pet Shop Alegria animal. Todos os Direitos Reservados</p>
    </footer>
    
</body>
</html>
