<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contato - TechStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <header class="bg-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-blue-600">TechStore</h1>
      <nav class="space-x-4">
        <a href="home.html" class="text-gray-700 hover:text-blue-600 font-medium">Home</a>
        <a href="sobre.html" class="text-gray-700 hover:text-blue-600 font-medium">Sobre</a>
        <a href="contato.html" class="text-blue-600 font-bold">Contato</a>
      </nav>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-16">
    <h2 class="text-3xl font-bold text-blue-600 mb-6 text-center">Fale Conosco</h2>
    <form class="space-y-6">
      <div>
        <label for="nome" class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
        <input type="text" id="nome" name="nome" required class="w-full px-4 py-2 border rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
        <input type="email" id="email" name="email" required class="w-full px-4 py-2 border rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label for="mensagem" class="block text-sm font-medium text-gray-700 mb-1">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="5" required class="w-full px-4 py-2 border rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-lg font-semibold transition">Enviar</button>
    </form>
  </main>

  <footer class="bg-gray-200 text-center py-6">
    <p class="text-gray-600">&copy; 2025 TechStore. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
